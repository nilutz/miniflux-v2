# Production stack: pinned, published images only -- no source build, no
# Go toolchain, no model download at deploy time. See docker-compose.dev.yaml
# for the development counterpart; the two are deliberately separate files.
#
#   cp .env.example .env   # then fill in every value -- see that file
#   docker compose -f docker-compose.yaml up -d
#
# Miniflux ends up on http://localhost:8080, the sidecar's admin/status
# page on ${SIDECAR_HOST_PORT}.
#
# Image tags are pinned to a released version, never `latest`: a compose
# file that silently changes what it runs on the next `pull` is not a
# production artifact.
#
# One database serves both services, same as the dev stack: the sidecar
# owns the `search` schema and reads `public.entries` read-only, so it
# must be the same PostgreSQL instance Miniflux writes to.

services:
  db:
    # ParadeDB, not stock postgres: the sidecar needs pg_search (BM25) and
    # vector (pgvector/HNSW), which stock PostgreSQL ships neither of.
    #
    # Pinned to a specific tag, not `latest`, for the same reason as the
    # two application images above. The `-pg18` suffix is load-bearing,
    # not decorative: ParadeDB publishes this image for PostgreSQL 15-18,
    # and only the pg18 build sets PGDATA=/var/lib/postgresql/18/docker
    # (confirmed via the registry's image config), matching the volume
    # comment below. Bumping this tag later must keep that suffix.
    image: paradedb/paradedb:0.25.9-pg18
    restart: unless-stopped
    # Docker's 64MiB /dev/shm default is too small for a parallel HNSW
    # index build (~1GB) and crash-loops the sidecar. Set explicitly.
    shm_size: "1gb"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required -- copy .env.example to .env and fill it in}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- copy .env.example to .env and fill it in}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required -- copy .env.example to .env and fill it in}
    volumes:
      # Mounted at /var/lib/postgresql, NOT .../data: ParadeDB's PostgreSQL
      # 18 image sets PGDATA=/var/lib/postgresql/18/docker, so mounting at
      # .../data would leave the real data directory on an anonymous volume.
      - miniflux-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No ports published: miniflux and sidecar reach db by service name.
    # Use `docker compose exec db psql -U "$POSTGRES_USER"` for ad-hoc access.

  miniflux:
    image: ghcr.io/nilutz/miniflux:v0.1.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required -- copy .env.example to .env and fill it in}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- copy .env.example to .env and fill it in}@db/${POSTGRES_DB:?POSTGRES_DB is required -- copy .env.example to .env and fill it in}?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME is required -- copy .env.example to .env and fill it in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required -- copy .env.example to .env and fill it in}
      # Upstream defaults this off; the fork enables it explicitly so new
      # feeds store full content instead of just the RSS excerpt to search.
      - CRAWLER_ENABLED_BY_DEFAULT=1
      # Empty by default falls back to Miniflux's own full-text search.
      # Pointing it at the sidecar enables keyword/semantic/hybrid/passage
      # modes and "more like this".
      - SEARCH_SIDECAR_URL=http://sidecar:8081
      - SEARCH_SIDECAR_TOKEN=${SIDECAR_SERVICE_TOKEN:?SIDECAR_SERVICE_TOKEN is required -- copy .env.example to .env and fill it in}
    healthcheck:
      # Miniflux's binary has a built-in health-check client
      # (internal/cli/health_check.go); this image ships no curl/wget.
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sidecar:
    image: ghcr.io/nilutz/miniflux-sidecar:v0.1.1
    restart: unless-stopped
    # Safe to publish: the sidecar authenticates every request with the
    # same credentials Miniflux issues (X-Auth-Token, or the browser's
    # MinifluxSessionID cookie, shared since cookies are scoped by host
    # not port) and requires the signed-in user to be a Miniflux admin
    # (is_admin) -- see sidecar/internal/web/auth.go and session_auth.go.
    ports:
      - "${SIDECAR_HOST_PORT:?SIDECAR_HOST_PORT is required -- copy .env.example to .env and fill it in}:8081"
    depends_on:
      db:
        condition: service_healthy
      # Ordering only: the sidecar reads public.entries, so Miniflux's
      # migrations must create that table first. service_healthy (rather
      # than service_started) works because Miniflux runs migrations
      # synchronously before /healthz can answer.
      miniflux:
        condition: service_healthy
    environment:
      - SIDECAR_DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required -- copy .env.example to .env and fill it in}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- copy .env.example to .env and fill it in}@db/${POSTGRES_DB:?POSTGRES_DB is required -- copy .env.example to .env and fill it in}?sslmode=disable
      # local runs the in-process ONNX embedder baked into the image (see
      # sidecar/Dockerfile). remote + SIDECAR_REMOTE_EMBEDDER_URL embeds on
      # another machine instead; the reported model identity feeds the
      # content hash, so switching embedders re-indexes the corpus.
      - SIDECAR_EMBEDDER=local
      # Required for the `ports:` mapping above: a process bound only to
      # 127.0.0.1 inside the container's network namespace never receives
      # traffic Docker forwards in from a published host port.
      - SIDECAR_ADMIN_ADDR=0.0.0.0:8081
      - SIDECAR_SERVICE_TOKEN=${SIDECAR_SERVICE_TOKEN:?SIDECAR_SERVICE_TOKEN is required -- copy .env.example to .env and fill it in}
    healthcheck:
      # No curl/wget and no built-in `-healthcheck` flag in this image, so
      # this is a bare TCP connect via bash's /dev/tcp -- confirms the
      # process accepts connections, not that indexing succeeded.
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/8081) 2>/dev/null' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  miniflux-db:
