# Development stack: this fork, built from source, with search.
#
#   docker compose -f docker-compose.dev.yaml up --build
#
# Miniflux is on http://localhost:8080, the sidecar's status page on
# http://localhost:8081/. The admin password is ADMIN_PASSWORD below.
#
# These credentials are committed and therefore public. That is acceptable
# only because every port is bound to 127.0.0.1 -- keep it that way, and
# never reuse them anywhere else.
#
# One database serves both: the sidecar owns the `search` schema and reads
# `public.entries` read-only, so it must be the same PostgreSQL instance
# Miniflux writes to.
#
# The first `up --build` is slow -- the sidecar image downloads the ONNX
# Runtime, libtokenizers and ~32MB of model weights. Later builds are cached.

services:
  db:
    # ParadeDB, not stock postgres: the sidecar needs pg_search (BM25) and
    # vector (pgvector/HNSW), which stock PostgreSQL ships neither of.
    image: paradedb/paradedb:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=Kvlu5vbFUfQYI29cgxstHcTnfFL6
      - POSTGRES_DB=miniflux
    volumes:
      # Mounted at /var/lib/postgresql, NOT .../data: this image sets
      # PGDATA=/var/lib/postgresql/18/docker, so mounting at .../data would
      # leave the real data directory unmounted, discarded on recreate.
      - miniflux-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s

  miniflux:
    build:
      context: .
      dockerfile: packaging/docker/alpine/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://miniflux:Kvlu5vbFUfQYI29cgxstHcTnfFL6@db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=IC7JaBrgMcf2QWdmMUd0
      # Upstream defaults this off; the dev stack enables it explicitly so
      # new feeds store full content instead of just the RSS excerpt.
      - CRAWLER_ENABLED_BY_DEFAULT=1
      # Empty by default falls back to Miniflux's own FTS. Pointing it at
      # the sidecar enables keyword/semantic/hybrid/passage modes and
      # "more like this".
      - SEARCH_SIDECAR_URL=http://sidecar:8081

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      # Ordering only -- the sidecar reads public.entries, so Miniflux's
      # migrations must create that table first. If the sidecar loses this
      # race on first boot it exits, and `restart: unless-stopped` retries.
      miniflux:
        condition: service_started
    environment:
      - SIDECAR_DATABASE_URL=postgres://miniflux:Kvlu5vbFUfQYI29cgxstHcTnfFL6@db/miniflux?sslmode=disable
      # local runs the in-process ONNX embedder baked into the image.
      # remote + SIDECAR_REMOTE_EMBEDDER_URL embeds on another machine
      # instead; the reported model identity feeds the content hash, so
      # switching embedders re-indexes the corpus.
      - SIDECAR_EMBEDDER=local

volumes:
  miniflux-db:
