# Fork-owned CI entry point.
#
# Upstream test workflows (tests.yml, linters.yml, sidecar.yml) trigger
# only on `pull_request`; this fork pushes straight to `main`, so this file
# runs the equivalent checks on push too, for both Go modules this repo
# contains (the root module and the separate sidecar/ module) -- without
# editing any upstream workflow file, since this fork rebases onto upstream
# indefinitely (see CLAUDE.md).
#
# Three independent jobs:
#
#   root             -- `make test` and `make lint` from the repository
#                        root; go test ./... never descends into sidecar/,
#                        a separate Go module with its own go.mod.
#   sidecar-hermetic -- exactly what sidecar.yml already runs: packages
#                        needing no build tags, native libraries or database.
#   sidecar-native   -- does not exist anywhere else. internal/embed/onnx
#                        and cmd/sidecar fail at the LINK step without
#                        libtokenizers.a and libonnxruntime, so sidecar.yml
#                        excludes them and their model-gated tests never
#                        run there. This job installs the pinned native
#                        dependencies and runs them for real.
name: Fork CI

permissions: read-all

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Must match sidecar/Dockerfile's ARG defaults and, for
  # TOKENIZERS_VERSION, sidecar/go.mod's daulet/tokenizers requirement
  # exactly -- the tokenizers Rust ABI is not stable across releases.
  ONNXRUNTIME_VERSION: "1.30.0"
  TOKENIZERS_VERSION: "v1.27.0"
  MODEL_REPO: "nomic-ai/nomic-embed-text-v1.5"
  # Bump to force-refresh the cached model download without touching the
  # version pins above.
  MODEL_CACHE_VERSION: "v1"

jobs:
  root:
    name: Root module (test + lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: make test
        run: make test

      # golangci-lint's release binaries lag the pinned Go toolchain;
      # `go install` builds it with the toolchain this job already set up.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: make lint
        run: make lint

  sidecar-hermetic:
    name: Sidecar hermetic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sidecar/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # SIDECAR_TEST_DATABASE_URL is intentionally not set: the
      # database-backed tests in these packages t.Skip without it.
      - name: Hermetic tests
        run: make test-hermetic

  sidecar-native:
    name: Sidecar native tests (ONNX Runtime + tokenizers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sidecar/go.sum

      # --- Native dependency 1: ONNX Runtime --------------------------
      # Runners are always linux/amd64, so this hardcodes the "x64" asset
      # name rather than the Dockerfile's TARGETARCH -> aarch64 mapping.
      - name: Cache ONNX Runtime
        id: cache-onnxruntime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/onnxruntime
          key: onnxruntime-linux-x64-${{ env.ONNXRUNTIME_VERSION }}

      - name: Download ONNX Runtime
        if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          sudo mkdir -p /opt/onnxruntime
          sudo tar -xzf /tmp/ort.tgz -C /opt/onnxruntime --strip-components=1
          rm /tmp/ort.tgz
          test -f /opt/onnxruntime/lib/libonnxruntime.so

      # --- Native dependency 2: libtokenizers.a ------------------------
      # Version MUST match sidecar/go.mod's daulet/tokenizers requirement.
      - name: Cache libtokenizers
        id: cache-tokenizers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/tokenizers
          key: libtokenizers-linux-amd64-${{ env.TOKENIZERS_VERSION }}

      - name: Download libtokenizers
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/tokenizers.tgz \
            "https://github.com/daulet/tokenizers/releases/download/${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz"
          sudo mkdir -p /opt/tokenizers
          sudo tar -xzf /tmp/tokenizers.tgz -C /opt/tokenizers
          rm /tmp/tokenizers.tgz
          test -f /opt/tokenizers/libtokenizers.a

      # --- Native dependency 3: the model (~131MB) ---------------------
      - name: Cache model
        id: cache-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/models
          key: sidecar-model-${{ env.MODEL_REPO }}-${{ env.MODEL_CACHE_VERSION }}

      - name: Download model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          set -eux
          model_dir="/opt/models/$(basename "${MODEL_REPO}")"
          sudo mkdir -p "${model_dir}/onnx"
          sudo chown -R "$(id -u):$(id -g)" /opt/models
          base="https://huggingface.co/${MODEL_REPO}/resolve/main"
          for f in tokenizer.json vocab.txt config.json tokenizer_config.json special_tokens_map.json; do
            curl -fsSL -o "${model_dir}/${f}" "${base}/${f}"
          done
          curl -fsSL -o "${model_dir}/onnx/model_quantized.onnx" "${base}/onnx/model_quantized.onnx"
          test -s "${model_dir}/onnx/model_quantized.onnx"

      # SIDECAR_TEST_DATABASE_URL stays unset (no database here), so the
      # handful of database-gated tests still skip -- see the checker
      # script for exactly which tests it does and doesn't require.
      - name: Run native tests
        env:
          CGO_LDFLAGS: "-L/opt/tokenizers"
          SIDECAR_MODEL_PATH: /opt/models/nomic-embed-text-v1.5/onnx/model_quantized.onnx
          SIDECAR_ONNX_LIB_DIR: /opt/onnxruntime/lib
          LD_LIBRARY_PATH: /opt/onnxruntime/lib
        run: |
          set -o pipefail
          go test -tags ORT -v ./internal/embed/... ./cmd/sidecar/ 2>&1 | tee test-output.log

      # go test prints "ok" even when every gated test in a run skipped --
      # this catches that false green (see the script's header comment).
      - name: Verify gated tests actually ran
        run: |
          "$GITHUB_WORKSPACE/.github/workflows/scripts/check-sidecar-gated-tests.sh" test-output.log
