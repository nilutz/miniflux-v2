# Fork-owned release pipeline, triggered by pushing a `v*` tag (a
# different namespace from upstream's own release tags, which match
# `[0-9]+.[0-9]+.[0-9]+` with no `v` prefix in build_binaries.yml and
# docker.yml -- see those files. Deliberately distinct so this workflow
# and upstream's release workflows can never both fire off the same tag).
#
# Upstream has no equivalent of this file: build_binaries.yml only builds
# the plain Miniflux binary, and docker.yml only builds the Miniflux
# container image -- neither knows the sidecar module exists. Both of
# those upstream files also carry `if: github.repository_owner ==
# 'miniflux'`, so on this fork they do not run at all (see this task's
# report for what was checked). This file is new, fork-owned, and does
# not edit either of them.
#
# Registry: ghcr.io only, authenticated with the built-in GITHUB_TOKEN.
# Upstream's docker.yml also pushes to Docker Hub and Quay, which need
# DOCKERHUB_USERNAME/TOKEN and QUAY_USERNAME/TOKEN secrets this fork does
# not have configured -- deliberately not copied here.
name: Fork Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Must match sidecar/Dockerfile's ARG defaults and sidecar/go.mod's
  # daulet/tokenizers requirement exactly -- see fork_ci.yml's identical
  # comment.
  TOKENIZERS_VERSION: "v1.27.0"

jobs:
  # Mirrors build_binaries.yml's own job: that workflow has no matrix,
  # it's one job compiling every platform Makefile's `build` target lists
  # (linux amd64/arm64/armv7/armv6/armv5/riscv64, darwin amd64/arm64,
  # freebsd amd64, openbsd amd64) with CGO_ENABLED=0. Reused as-is rather
  # than inventing a different platform list.
  binaries:
    name: Build Miniflux binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum

      - name: Compile binaries
        env:
          CGO_ENABLED: 0
        run: make build

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miniflux-binaries
          path: miniflux-*
          if-no-files-found: error
          retention-days: 5

  # Upstream's release pipeline has no equivalent job: this binary needs
  # -tags ORT and the native tokenizers library, neither of which any
  # upstream workflow knows about (see sidecar.yml's own header comment).
  #
  # Only libtokenizers.a is needed here, not the ONNX Runtime shared
  # library or the model: sidecar/Dockerfile's build stage links
  # libtokenizers.a in statically (CGO_LDFLAGS="-L/opt/tokenizers") but
  # does not reference ONNX Runtime at build time at all -- ONNXLibraryDir
  # is a runtime path the binary dlopen's later, via SIDECAR_ONNX_LIB_DIR.
  sidecar-binary:
    name: Build sidecar binary (linux/amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sidecar/go.sum

      - name: Cache libtokenizers
        id: cache-tokenizers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/tokenizers
          key: libtokenizers-linux-amd64-${{ env.TOKENIZERS_VERSION }}

      - name: Download libtokenizers
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/tokenizers.tgz \
            "https://github.com/daulet/tokenizers/releases/download/${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz"
          sudo mkdir -p /opt/tokenizers
          sudo tar -xzf /tmp/tokenizers.tgz -C /opt/tokenizers
          rm /tmp/tokenizers.tgz
          test -f /opt/tokenizers/libtokenizers.a

      - name: Build sidecar
        env:
          CGO_ENABLED: 1
          CGO_LDFLAGS: "-L/opt/tokenizers"
        run: |
          go build -tags ORT -o sidecar-linux-amd64 ./cmd/sidecar
          sha256sum sidecar-linux-amd64 > sidecar-linux-amd64.sha256

      - name: Upload sidecar binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecar-binary
          path: |
            sidecar/sidecar-linux-amd64
            sidecar/sidecar-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 5

  miniflux-image:
    name: Build and push Miniflux image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/miniflux
          tags: type=semver,pattern={{raw}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: this fork has not measured how long a
      # QEMU-emulated multi-platform build of this Dockerfile takes, and
      # is not building images locally to find out (see this task's
      # report). Upstream's own 5-platform matrix is a known-slow
      # baseline this fork does not want to inherit by default; widen
      # this list later if there's a real need for another platform and
      # the build time is verified acceptable.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./packaging/docker/alpine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

  sidecar-image:
    name: Build and push sidecar image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/miniflux-sidecar
          tags: type=semver,pattern={{raw}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only -- required, not just preferred: sidecar/Dockerfile
      # is ~219MB before the model and downloads ~131MB more of model
      # weights at build time (see its own header comment). A 5-platform
      # QEMU matrix here would multiply that by 5 for an arm64 (etc.)
      # sidecar image nothing here is known to use yet.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sidecar
          file: sidecar/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, sidecar-binary, miniflux-image, sidecar-image]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miniflux-binaries
          path: dist

      - name: Download sidecar binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sidecar-binary
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
