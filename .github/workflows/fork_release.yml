# Fork-owned release pipeline, triggered by pushing a `v*` tag -- a
# different namespace from upstream's own release tags (`[0-9]+.[0-9]+.[0-9]+`,
# no `v` prefix, in build_binaries.yml and docker.yml), so this workflow and
# upstream's can never both fire on the same tag.
#
# Upstream has no equivalent: build_binaries.yml only builds the plain
# Miniflux binary and docker.yml only builds the Miniflux image; neither
# knows the sidecar module exists. Both also carry `if:
# github.repository_owner == 'miniflux'`, so they do not run on this fork
# at all. This file is new, fork-owned, and edits neither of them.
#
# Registry: ghcr.io only, authenticated with the built-in GITHUB_TOKEN.
# Upstream's docker.yml also pushes to Docker Hub and Quay, which need
# secrets this fork does not have configured.
name: Fork Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Must match sidecar/Dockerfile's ARG defaults and sidecar/go.mod's
  # daulet/tokenizers requirement exactly -- see fork_ci.yml's identical
  # comment.
  TOKENIZERS_VERSION: "v1.27.0"

jobs:
  # Mirrors build_binaries.yml's own job: one job compiling every platform
  # Makefile's `build` target lists, with CGO_ENABLED=0.
  binaries:
    name: Build Miniflux binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum

      - name: Compile binaries
        env:
          CGO_ENABLED: 0
        run: make build

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miniflux-binaries
          path: miniflux-*
          if-no-files-found: error
          retention-days: 5

  # Upstream has no equivalent job: this binary needs -tags ORT and the
  # native tokenizers library.
  #
  # Only libtokenizers.a is needed here: sidecar/Dockerfile's build stage
  # links it in statically, but does not reference the ONNX Runtime shared
  # library at build time -- that's a runtime path the binary dlopen's
  # later, via SIDECAR_ONNX_LIB_DIR.
  sidecar-binary:
    name: Build sidecar binary (linux/amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sidecar/go.sum

      - name: Cache libtokenizers
        id: cache-tokenizers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/tokenizers
          key: libtokenizers-linux-amd64-${{ env.TOKENIZERS_VERSION }}

      - name: Download libtokenizers
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/tokenizers.tgz \
            "https://github.com/daulet/tokenizers/releases/download/${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz"
          sudo mkdir -p /opt/tokenizers
          sudo tar -xzf /tmp/tokenizers.tgz -C /opt/tokenizers
          rm /tmp/tokenizers.tgz
          test -f /opt/tokenizers/libtokenizers.a

      - name: Build sidecar
        env:
          CGO_ENABLED: 1
          CGO_LDFLAGS: "-L/opt/tokenizers"
        run: |
          go build -tags ORT -o sidecar-linux-amd64 ./cmd/sidecar
          sha256sum sidecar-linux-amd64 > sidecar-linux-amd64.sha256

      - name: Upload sidecar binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecar-binary
          path: |
            sidecar/sidecar-linux-amd64
            sidecar/sidecar-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 5

  # Both images are built per-platform on a native runner (never QEMU) and
  # pushed by digest, then stitched into one multi-arch manifest list by
  # the matching "*-merge" job below via `docker buildx imagetools
  # create`. This mirrors Docker's documented pattern for multi-platform
  # images built across parallel jobs.
  #
  # Native over emulated matters far more for sidecar-image than for
  # miniflux-image -- see that job's comment -- but ubuntu-24.04-arm is a
  # free hosted runner for public repos, so there is no cost to using it
  # for both and keeping one pattern for the whole file.
  miniflux-image-build:
    name: Build Miniflux image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${PLATFORM/\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./packaging/docker/alpine/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/miniflux,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -eux
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miniflux-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  miniflux-image-merge:
    name: Merge and push Miniflux manifest
    runs-on: ubuntu-latest
    needs: [miniflux-image-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: miniflux-digests-*
          merge-multiple: true

      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/miniflux
          tags: type=semver,pattern={{raw}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -eux
          # shellcheck disable=SC2046  # word-splitting is intentional: each
          # word becomes its own -t/@sha256 argument to imagetools create.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/miniflux@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/miniflux:${{ steps.docker_tags.outputs.version }}

  sidecar-image-build:
    name: Build sidecar image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${PLATFORM/\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native runners, not QEMU, are required here (not just preferred):
      # this Dockerfile compiles Go with CGO enabled and links against a
      # downloaded ONNX Runtime .so and a prebuilt Rust libtokenizers.a.
      # Under linux/arm64 emulation on an amd64 runner that build is slow
      # enough to risk the job timeout; ubuntu-24.04-arm builds it
      # natively instead, at the same free tier as ubuntu-latest for
      # public repos.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sidecar
          file: sidecar/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/miniflux-sidecar,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -eux
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecar-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  sidecar-image-merge:
    name: Merge and push sidecar manifest
    runs-on: ubuntu-latest
    needs: [sidecar-image-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: sidecar-digests-*
          merge-multiple: true

      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/miniflux-sidecar
          tags: type=semver,pattern={{raw}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -eux
          # shellcheck disable=SC2046  # word-splitting is intentional: each
          # word becomes its own -t/@sha256 argument to imagetools create.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/miniflux-sidecar@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/miniflux-sidecar:${{ steps.docker_tags.outputs.version }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, sidecar-binary, miniflux-image-merge, sidecar-image-merge]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miniflux-binaries
          path: dist

      - name: Download sidecar binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sidecar-binary
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
