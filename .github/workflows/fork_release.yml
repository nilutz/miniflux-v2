# Fork-owned release pipeline, triggered by pushing a `v*` tag -- a
# different namespace from upstream's own release tags (`[0-9]+.[0-9]+.[0-9]+`,
# no `v` prefix, in build_binaries.yml and docker.yml), so this workflow and
# upstream's can never both fire on the same tag.
#
# Upstream has no equivalent: build_binaries.yml only builds the plain
# Miniflux binary and docker.yml only builds the Miniflux image; neither
# knows the sidecar module exists. Both also carry `if:
# github.repository_owner == 'miniflux'`, so they do not run on this fork
# at all. This file is new, fork-owned, and edits neither of them.
#
# Registry: ghcr.io only, authenticated with the built-in GITHUB_TOKEN.
# Upstream's docker.yml also pushes to Docker Hub and Quay, which need
# secrets this fork does not have configured.
name: Fork Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Must match sidecar/Dockerfile's ARG defaults and sidecar/go.mod's
  # daulet/tokenizers requirement exactly -- see fork_ci.yml's identical
  # comment.
  TOKENIZERS_VERSION: "v1.27.0"

jobs:
  # Mirrors build_binaries.yml's own job: one job compiling every platform
  # Makefile's `build` target lists, with CGO_ENABLED=0.
  binaries:
    name: Build Miniflux binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum

      - name: Compile binaries
        env:
          CGO_ENABLED: 0
        run: make build

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miniflux-binaries
          path: miniflux-*
          if-no-files-found: error
          retention-days: 5

  # Upstream has no equivalent job: this binary needs -tags ORT and the
  # native tokenizers library.
  #
  # Only libtokenizers.a is needed here: sidecar/Dockerfile's build stage
  # links it in statically, but does not reference the ONNX Runtime shared
  # library at build time -- that's a runtime path the binary dlopen's
  # later, via SIDECAR_ONNX_LIB_DIR.
  sidecar-binary:
    name: Build sidecar binary (linux/amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sidecar/go.sum

      - name: Cache libtokenizers
        id: cache-tokenizers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/tokenizers
          key: libtokenizers-linux-amd64-${{ env.TOKENIZERS_VERSION }}

      - name: Download libtokenizers
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/tokenizers.tgz \
            "https://github.com/daulet/tokenizers/releases/download/${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz"
          sudo mkdir -p /opt/tokenizers
          sudo tar -xzf /tmp/tokenizers.tgz -C /opt/tokenizers
          rm /tmp/tokenizers.tgz
          test -f /opt/tokenizers/libtokenizers.a

      - name: Build sidecar
        env:
          CGO_ENABLED: 1
          CGO_LDFLAGS: "-L/opt/tokenizers"
        run: |
          go build -tags ORT -o sidecar-linux-amd64 ./cmd/sidecar
          sha256sum sidecar-linux-amd64 > sidecar-linux-amd64.sha256

      - name: Upload sidecar binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecar-binary
          path: |
            sidecar/sidecar-linux-amd64
            sidecar/sidecar-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 5

  miniflux-image:
    name: Build and push Miniflux image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/miniflux
          tags: type=semver,pattern={{raw}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: build time for a QEMU-emulated multi-platform
      # build of this Dockerfile is unmeasured. Widen later if needed.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./packaging/docker/alpine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

  sidecar-image:
    name: Build and push sidecar image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/miniflux-sidecar
          tags: type=semver,pattern={{raw}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only, required not just preferred: the image is
      # ~219MB before the model plus ~131MB more of model weights, so a
      # 5-platform QEMU matrix would multiply that for platforms nothing
      # here uses yet.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sidecar
          file: sidecar/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, sidecar-binary, miniflux-image, sidecar-image]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miniflux-binaries
          path: dist

      - name: Download sidecar binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sidecar-binary
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
